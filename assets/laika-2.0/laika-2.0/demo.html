<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laika 2.0 · gestos</title>
<style>
  :root {
    --fondo: #f3f1f8; --tarjeta: #ffffff; --texto: #1d1a2e; --suave: #5d5876;
    --borde: #dcd8ea; --acento: #d9482b; --sobre-acento: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #12111c; --tarjeta: #1c1a2b; --texto: #f1eefb; --suave: #a9a3c4; --borde: #34304d; --acento: #ff7a52; --sobre-acento: #1d1a2e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); padding: 24px 16px; line-height: 1.5; }
  main { max-width: 960px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  h1 { margin: 0 0 4px; font-size: 2rem; line-height: 1.1; }
  p.sub { margin: 0 0 16px; color: var(--suave); }
  .escena {
    position: relative; overflow: hidden; border-radius: 24px; aspect-ratio: 4 / 4.6; display: grid; place-items: end center;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff 99%, transparent), radial-gradient(2px 2px at 82% 12%, #fff 99%, transparent),
      radial-gradient(1.5px 1.5px at 68% 30%, #cfd6ff 99%, transparent), radial-gradient(2px 2px at 24% 42%, #ffe9b0 99%, transparent),
      radial-gradient(1.5px 1.5px at 90% 48%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 42% 9%, #fff 99%, transparent),
      linear-gradient(180deg, #10163a 0%, #2b2466 70%, #3b2f7a 100%);
  }
  .escena::after {
    content: ""; position: absolute; left: -20%; right: -20%; bottom: -34%; height: 52%; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 0%, #b9b2dc 0%, #8f88b8 55%, #6f6898 100%);
  }
  .escena laika-mascota { position: relative; z-index: 1; max-width: 88%; cursor: pointer; margin-bottom: 7%; }
  .panel { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 20px; padding: 18px; }
  .botones { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  button {
    font: inherit; text-align: left; border: 2px solid var(--borde); background: transparent; color: var(--texto);
    border-radius: 14px; padding: 10px 12px; cursor: pointer; transition: transform .1s, border-color .2s;
  }
  button:hover { border-color: var(--acento); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--sobre-acento); }
  button b { display: block; }
  button span { font-size: .8rem; opacity: .8; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; margin-top: 16px; }
  td { padding: 6px 4px; border-top: 1px solid var(--borde); vertical-align: top; }
  td:first-child { font-weight: 600; white-space: nowrap; font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
  <main>
    <section>
      <h1>Laika 2.0</h1>
      <p class="sub">Elige un gesto o haz clic sobre ella. También funcionan las teclas 1 a 7.</p>
      <div class="escena">
        <laika-mascota id="laika" estado="saludar" tamano="400"></laika-mascota>
      </div>
    </section>

    <section class="panel">
      <div class="botones" id="botones"></div>
      <table id="tabla"></table>
    </section>
  </main>

<script src="laika2.js"></script>
<script>
  const GESTOS = {
    saludar:  { nombre: "Saludar",       uso: "Abrir la app, dar la bienvenida" },
    saltar:   { nombre: "Saltar",        uso: "Llamar la atención, acierto rápido" },
    celebrar: { nombre: "Celebrar",      uso: "Meta cumplida, nivel superado" },
    triste:   { nombre: "Triste",        uso: "Error, intento fallido" },
    ladrar:   { nombre: "Ladrar",        uso: "Aviso o notificación" },
    ladear:   { nombre: "Ladear cabeza", uso: "Duda, falta un dato" },
    cola:     { nombre: "Mover cola",    uso: "Alegría, caricia" },
  };
  const laika = document.getElementById("laika");
  const botones = document.getElementById("botones");
  const tabla = document.getElementById("tabla");
  const claves = Object.keys(GESTOS);

  claves.forEach((g, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.gesto = g;
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<b>${GESTOS[g].nombre}</b><span>tecla ${i + 1}</span>`;
    b.addEventListener("click", () => laika.accion(g));
    botones.appendChild(b);

    const fila = tabla.insertRow();
    fila.insertCell().textContent = g;
    fila.insertCell().textContent = GESTOS[g].uso;
  });

  laika.addEventListener("laika-estado", (e) => {
    botones.querySelectorAll("button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.gesto === e.detail.estado)));
  });
  laika.addEventListener("click", () => laika.accion("ladrar"));
  document.addEventListener("keydown", (e) => {
    const i = parseInt(e.key, 10);
    if (i >= 1 && i <= claves.length && !e.ctrlKey && !e.metaKey && !e.altKey) laika.accion(claves[i - 1]);
  });
</script>
</body>
</html>
