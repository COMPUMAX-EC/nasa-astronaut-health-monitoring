<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@400;600&display=swap">
<style>
* { margin: 0; box-sizing: border-box; }
html, body { height: 100%; background: #04091a; overflow: hidden; }
#escenario { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
#escenario > section { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; transition: opacity 450ms ease; }
#escenario > section.saliendo { opacity: 0; }
#escenario aside { display: none; }
img, video { display: block; }
.icono, svg.icono { display: block; }
#notas { position: fixed; left: 0; right: 0; bottom: 0; max-height: 32vh; overflow: auto; padding: 16px 24px; background: rgba(4,9,26,.92); color: #e6edf8; font: 18px/1.5 Inter, Arial, sans-serif; display: none; }
#notas.ver { display: block; }
#ayuda { position: fixed; right: 16px; bottom: 12px; color: rgba(230,237,248,.55); font: 13px Inter, Arial, sans-serif; transition: opacity .6s; }
:root {
  --noche: #07173F;
  --noche2: #0B2C6E;
  --crema: #F5F8FD;
  --crema2: #E6EDF8;
  --naranja: #D0281A;
  --azul: #2E96F5;
  --tinta: #1B2D57;
  --suave: #C3D3EE;
  --fondo: #0A2A6B;
  --fondo-claro: #C9D6EC;
}
body { font-family: 'Inter', Arial, sans-serif; color: var(--crema); }
section { counter-increment: page; padding: 128px 128px 160px; background: linear-gradient(135deg, #0042A6 0%, #07173F 100%); display: flex; flex-direction: column; gap: 40px; }
section.claro { background: var(--fondo-claro); color: var(--tinta); }
section.acento { background: var(--naranja); color: var(--noche); }
h1, h2, h3 { font-family: 'Space Grotesk', Arial, sans-serif; }
h1 { font-size: 120px; font-weight: 700; line-height: 1.0; color: var(--crema); }
h2 { font-size: 72px; font-weight: 700; line-height: 1.05; color: var(--crema); }
section.claro h2 { color: var(--noche); }
h3 { font-size: 44px; font-weight: 600; line-height: 1.1; }
.ceja { font-size: 28px; font-weight: 600; letter-spacing: 3px; color: var(--naranja); }
section.claro .ceja { color: #D0281A; }
.texto { font-size: 32px; line-height: 1.4; color: var(--suave); }
section.claro .texto { color: var(--tinta); }
.pie { position: absolute; left: 128px; bottom: 64px; width: 1664px; font-size: 24px; color: var(--suave); display: flex; justify-content: space-between; }
section.claro .pie { color: var(--tinta); }
.fila { display: flex; gap: 32px; }
.tarjeta { flex: 1; background: var(--noche2); border-top: 5px solid #D0281A; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; gap: 16px; }
section.claro .tarjeta { background: var(--crema2); }
.tarjeta h3 { color: var(--crema); font-size: 40px; }
section.claro .tarjeta h3 { color: var(--noche); }
.tarjeta .texto { font-size: 28px; }
.icono { width: 56px; height: 56px; color: var(--naranja); }
section.claro .icono { color: #D0281A; }
.grande { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 120px; font-weight: 700; line-height: 1; color: var(--naranja); }
.tabla { font-size: 28px; color: var(--tinta); }
.paso { display: flex; gap: 24px; align-items: center; }
.num { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 44px; font-weight: 700; color: var(--naranja); width: 64px; }
.paso .texto { font-size: 30px; }
.entra { animation: subir 600ms ease-out both; animation-delay: calc(var(--i, 0) * 120ms); }
@keyframes subir { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

.escena-clip { position: absolute; border-radius: 32px; object-fit: cover; box-shadow: 0 12px 32px rgba(14, 22, 48, .28); }
.laica-clip { position: absolute; object-fit: contain; transform-origin: 50% 93%; }
.laica-vuelo { position: absolute; object-fit: contain; transform-origin: 50% 93%; opacity: 0; }
.rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; width: 1000px; }
.rejilla .tarjeta { padding: 32px; }
.logo-sa { position: absolute; left: 40px; top: 32px; width: 88px; height: 88px; border-radius: 18px; box-shadow: 0 4px 14px rgba(10,16,32,.28); }

section.claro .num, section.claro .grande { color: #D0281A; }

<p class="texto entra" style="--i:2; width:940px; font-size:40px; color:var(--crema);">Una compañera que cuida la salud del astronauta cuando la Tierra está demasiado lejos para contestar.</p>
<p class="texto entra" style="--i:3; width:940px;">Reto: <b>Create Health Monitoring Software for Astronauts on Space Missions</b></p>
<p class="texto entra" style="--i:4; width:940px;">Equipo <b>Compumax Evolution</b> · Ecuador<br>Melany Irua · Diego Paz · Geovanny Basantes</p>

<p class="ceja">EL PROBLEMA</p>
<h2 style="width:1300px;">Lejos de la Tierra, el astronauta es su propio médico de guardia</h2>
<div class="fila">
<div class="tarjeta entra" style="--i:0; padding:32px;"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><h3 style="font-size:34px;">Radiación</h3><p class="texto" style="font-size:26px;">Tormentas solares y dosis acumulada</p></div>
<div class="tarjeta entra" style="--i:1; padding:32px;"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.2.7 3.5 2.8 3.5 5.7"/></svg><h3 style="font-size:34px;">Aislamiento</h3><p class="texto" style="font-size:26px;">Estrés, ánimo y sueño</p></div>
<div class="tarjeta entra" style="--i:2; padding:32px;"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><h3 style="font-size:34px;">Distancia</h3><p class="texto" style="font-size:26px;">Hasta 22 min de retraso con tierra</p></div>
<div class="tarjeta entra" style="--i:3; padding:32px;"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><h3 style="font-size:34px;">Gravedad</h3><p class="texto" style="font-size:26px;">Hueso, músculo, corazón y ojos</p></div>
<div class="tarjeta entra" style="--i:4; padding:32px;"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg><h3 style="font-size:34px;">Hábitat</h3><p class="texto" style="font-size:26px;">Entorno cerrado y hostil</p></div>
</div>
<p class="texto" style="width:1600px; font-size:28px;">Los 5 peligros del vuelo espacial humano (NASA Human Research Program). El reto pide software para que el tripulante <b>recopile sus indicadores, entienda su estado y actúe</b>. Usuarios: tripulaciones de Artemis y Marte, análogos como HERA y CHAPEA, y en la Tierra, personal aislado como el de la estación antártica ecuatoriana.</p>
<div class="pie"><span>Fuentes: NASA HRP, “5 Hazards” (nasa.gov/hrp/hazards) y “HRP Risks” (nasa.gov/hrp/risks) · NASA OCHMO, TB‑044 y TB‑016</span><span>2</span></div>
<aside>[0:30–1:15] La NASA resume los riesgos del vuelo espacial en 5 peligros: radiación, aislamiento, distancia, gravedad y entorno hostil. Recorrer las tarjetas en una frase cada una. Punto clave: con hasta 22 minutos de retraso en cada sentido, el tripulante no puede esperar a que tierra le conteste; tiene que darse cuenta solo de que algo cambia. Y el aislamiento no es un detalle: está en la lista oficial de riesgos del HRP. Usuarios: astronautas de misiones largas, tripulaciones de análogos (HERA, CHAPEA) y, aquí en la Tierra, gente aislada: la estación Pedro Vicente Maldonado en la Antártida, Galápagos, comunidades rurales. Si preguntan por las fuentes: los 5 peligros y la lista de riesgos son del Human Research Program de la NASA; el retraso y la salud conductual, de los boletines técnicos TB‑044 y TB‑016 de la Oficina del Director Médico de la NASA (OCHMO). La estación antártica la opera el INAE; es un caso de uso que propone el equipo.</aside>

<div class="tarjeta entra" style="--i:1;"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg><h3>Alertas</h3><p class="texto">4 niveles y qué hacer</p></div>

</div>
<div class="pie"><span>Comparación con CMO‑DA, Astroskin, AMOS y otras: docs/10 del repositorio</span><span>3</span></div>
<aside>[1:15–2:00] Misión Laica es una app que funciona sin conexión. Cuatro piezas: el check‑in diario (por voz, teclado o clics), un motor de alertas con cuatro niveles (verde, amarillo, naranja, rojo) que dice qué hacer y cuándo escalar al médico de vuelo, un cuerpo humano clicable que se colorea según el peor indicador de cada zona, y Laica, la compañera. Las soluciones existentes miden; Misión Laica además acompaña. Sin internet ni nube: los datos nunca salen del equipo. ¿Por qué una mascota? Porque el aislamiento es uno de los 5 peligros. Laica cambia de tono: con todo en verde bromea; en una alerta roja deja el humor y da instrucciones claras. (Laica camina hacia el público mientras se habla.)</aside>

<aside>[2:00–2:50] Aquí está el rigor. No inventamos umbrales: los límites salen de NASA‑STD‑3001, el estándar médico de la NASA (por ejemplo, el límite de radiación de carrera de 600 mSv). Del Human Research Roadmap sacamos los riesgos por sistema y armamos una matriz de 47 indicadores con probabilidad por gravedad, frecuencia de medición y cómo se recolecta cada uno. La API DONKI de la NASA da los eventos de partículas solares; nuestro script los descarga, y la tormenta solar de la demo sigue ese tipo de evento y activa la alerta de radiación (conectarla en vivo es la fase 6). El flujo: fuentes, matriz, reglas con umbrales, nivel y acción. Honestidad: los datos del tripulante son simulados (30 días, semilla fija, reproducibles), porque no tenemos sensores reales; los umbrales y eventos sí son de fuentes oficiales. Mostrar aquí una captura de la tabla de la matriz o del script de DONKI.</aside>

<div class="fila">
<div class="tarjeta entra" style="--i:0;"><h3>En el espacio</h3><p class="texto">Autonomía médica para Artemis y Marte, y para análogos como HERA y CHAPEA.</p></div>

<script>
const plantilla = document.getElementById("diapositivas").content;
const total = plantilla.querySelectorAll("section").length;
const escenario = document.getElementById("escenario");
const notas = document.getElementById("notas");
let actual = -1;

function ajustar() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  escenario.style.transform = `scale(${k}) translate(-50%, -50%)`;
}

function mostrar(i) {
  i = Math.max(0, Math.min(total - 1, i));
  if (i === actual) return;
  const previa = escenario.querySelector("section");
  // Clonar la diapositiva desde la plantilla reinicia sus animaciones CSS y sus videos.
  const nueva = plantilla.querySelectorAll("section")[i].cloneNode(true);
  escenario.appendChild(nueva);
  nueva.querySelectorAll("video").forEach(v => { v.currentTime = 0; v.play().catch(() => {}); });
  if (previa) { previa.classList.add("saliendo"); setTimeout(() => previa.remove(), 460); }
  actual = i;
  const aside = nueva.querySelector("aside");
  notas.textContent = aside ? aside.textContent : "";
  history.replaceState(null, "", "#" + (i + 1));
}

addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) mostrar(actual + 1);
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) mostrar(actual - 1);
  else if (e.key === "Home") mostrar(0);
  else if (e.key === "End") mostrar(total - 1);
  else if (e.key.toLowerCase() === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else if (e.key.toLowerCase() === "n") notas.classList.toggle("ver");
  else return;
  e.preventDefault();
});
addEventListener("click", e => { if (!notas.contains(e.target)) mostrar(actual + (e.clientX < innerWidth / 4 ? -1 : 1)); });
addEventListener("resize", ajustar);
setTimeout(() => document.getElementById("ayuda").style.opacity = 0, 4000);
ajustar();
mostrar((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
